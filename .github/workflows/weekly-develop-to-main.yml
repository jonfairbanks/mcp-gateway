name: Weekly Develop to Main

on:
  schedule:
    - cron: "15 14 * * 1"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: weekly-develop-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Develop to Main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Detect Unreleased Changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead_by="$(gh api "repos/$GH_REPO/compare/main...develop" --jq '.ahead_by')"
          if [ "$ahead_by" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No unreleased develop commits." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or Find Release PR
        if: steps.changes.outputs.has_changes == 'true'
        id: release
        env:
          # Unlike GITHUB_TOKEN, this token lets PR creation and merging trigger CI.
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Configure PERSONAL_TOKEN with repository Contents and Pull requests write access." >&2
            exit 1
          fi
          pr_url="$(gh pr list --base main --head develop --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head develop \
              --title 'chore: release develop to main' \
              --body 'Automated weekly release from develop to main. Required checks and branch rules gate merging.')"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')" >> "$GITHUB_OUTPUT"
          echo "Release PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Required Checks and Merge
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.release.outputs.pr_url }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
        run: |
          required="$(gh api "repos/$GH_REPO/branches/main/rules" --jq \
            '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique')"
          if [ "$(jq 'length' <<< "$required")" -eq 0 ]; then
            echo "No required checks found; refusing to merge." >&2
            exit 1
          fi
          ready=false
          for attempt in {1..90}; do
            current_head="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
            if [ "$current_head" != "$HEAD_SHA" ]; then
              echo "Develop advanced during verification; rerun promotion for the new head." >&2
              exit 1
            fi
            # PR checks include the tested merge commit as well as develop's image builds.
            checks="$(gh pr checks "$PR_URL" --required --json name,state)" || checks='[]'
            if jq -e --argjson required "$required" \
              '. as $checks | all($required[]; . as $name | any($checks[]; .name == $name and .state == "SUCCESS"))' \
              <<< "$checks" >/dev/null; then
              ready=true
              break
            fi
            sleep 20
          done
          if [ "$ready" != true ]; then
            echo "Timed out waiting for required checks." >&2
            exit 1
          fi
          # Keep merge commits and Conventional Commit history. Never bypass protection.
          gh pr merge "$PR_URL" --auto --merge --match-head-commit "$HEAD_SHA"
          for attempt in {1..30}; do
            if [ "$(gh pr view "$PR_URL" --json state --jq '.state')" = MERGED ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Protected auto-merge did not complete." >&2
          exit 1

      - name: Verify Main Release and Image Publication
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.release.outputs.pr_url }}
        run: |
          release_sha="$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid')"
          for workflow in release.yml docker-publish.yml; do
            run_id=""
            for attempt in {1..30}; do
              run_id="$(gh run list --workflow "$workflow" --branch main --event push \
                --commit "$release_sha" --limit 20 --json databaseId --jq '.[0].databaseId')"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 10
            done
            if [ -z "$run_id" ]; then
              echo "No $workflow push run found for $release_sha." >&2
              exit 1
            fi
            gh run watch "$run_id" --exit-status --interval 10
            echo "$workflow: https://github.com/$GH_REPO/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
          done
