name: Publish Docker Image

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Determine image tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tag="latest"
          else
            tag="develop"
          fi
          {
            echo "image=${image}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

  build:
    permissions:
      contents: read
      packages: write
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64' && runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          # A partial retry retains this run and source revision.
          tags: ${{ needs.meta.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=docker-publish-${{ matrix.arch }}
            type=registry,ref=${{ needs.meta.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=docker-publish-${{ matrix.arch }}
            type=registry,ref=${{ needs.meta.outputs.image }}:buildcache-${{ matrix.arch }},mode=max

  publish:
    permissions:
      packages: write
    needs:
      - meta
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}" \
            "${{ needs.meta.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-amd64" \
            "${{ needs.meta.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-arm64"
